<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Garagem">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Garagem do Palio</title>
  <script>
    // Restaura o tema salvo antes da primeira pintura (evita flash de tema).
    (function () {
      try {
        var t = localStorage.getItem('garagem-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'light' ? '#eef0f3' : '#0b0d10');
        }
      } catch (e) { /* localStorage indisponível */ }
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- Header -->
  <header id="header" class="header" role="banner"></header>

  <!-- Main Content -->
  <main id="main-content" class="main" role="main"></main>

  <!-- FAB Container -->
  <div id="fab-container"></div>

  <!-- Chat Bar Container -->
  <div id="chat-bar-container"></div>

  <!-- Navigation -->
  <nav id="nav" class="nav" role="navigation" aria-label="Navegação principal"></nav>

  <!-- Modal Root (for confirmations, alerts) -->
  <div id="modal-root"></div>

  <!-- Form Modal Root (for record forms) -->
  <div id="form-modal-root"></div>

  <!-- Offline Banner -->
  <div class="offline-banner" id="offline-banner" role="status" aria-live="polite" hidden>
    Você está offline. As alterações serão sincronizadas quando a conexão voltar.
  </div>
</body>
</html>
